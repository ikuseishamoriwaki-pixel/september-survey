<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9月通常授業アンケート</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p>進学塾SOIL 出町校</p>
      <h1>9月通常授業アンケート</h1>
      <span id="pageLead">来られる曜日・時間を選んで送信してください。</span>
    </header>

    <nav id="tabs" class="tabs" aria-label="入力切り替え">
      <a class="tab" data-page-link="student" href="./student.html">生徒用</a>
      <a class="tab" data-page-link="teacher" href="./teacher.html">講師用</a>
    </nav>

    <section id="studentView" class="panel view">
      <div class="panel-title">
        <h2>生徒用</h2>
        <p>9月からの通常授業日時を決めるためのアンケートです。最初はすべて〇にしています。来れない日時に×をして、8/16（日）までに提出してください。期限までの提出が難しい場合はお知らせください。よろしくお願いします。</p>
      </div>

      <form id="studentForm" class="form">
        <div class="student-select-row">
          <label>
            学年
            <select id="studentGrade" name="grade" required>
              <option value="">未選択</option>
            </select>
          </label>

          <label>
            生徒名
            <select id="studentName" name="name" required disabled>
              <option value="">未選択</option>
            </select>
          </label>
        </div>

        <div class="grid-card">
          <div class="grid-label">〇＝通塾できる / ×＝通塾できない</div>
          <div id="studentGrid" class="slot-grid student-grid"></div>
        </div>

        <div id="studentReview" class="own-answer"></div>

        <label>
          補足
          <textarea id="studentMemo" rows="3" placeholder="備考欄"></textarea>
        </label>

        <button class="primary" type="submit">生徒回答を送信</button>
      </form>
    </section>

    <section id="teacherView" class="panel view">
      <div class="panel-title">
        <h2>講師用</h2>
        <p>9月からの勤務日時を決めるため、来れる日時をタップして提出をお願いします。期限は8/16（日）までです。もし期限内の提出が厳しければお知らせください。</p>
      </div>

      <form id="teacherForm" class="form">
        <label>
          講師名
          <select id="teacherName" name="name" required>
            <option value="">未選択</option>
          </select>
        </label>

        <div class="grid-card">
          <div class="grid-label">勤務可能な曜日</div>
          <div id="teacherGrid" class="teacher-days"></div>
        </div>

        <div id="teacherReview" class="own-answer"></div>

        <label>
          補足
          <textarea id="teacherMemo" rows="3" placeholder="勤務に関する補足があれば入力してください。"></textarea>
        </label>

        <button class="primary" type="submit">講師回答を送信</button>
      </form>
    </section>

    <p id="statusMessage" class="status" aria-live="polite"></p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
